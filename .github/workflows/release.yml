name: Build and Release

# Push a `beta*` tag -> both binaries are built on GitHub runners and
# published as a pre-release. Binaries never travel from a local machine:
# only the (small) source push crosses the wire, the heavy artifacts are
# built and uploaded from GitHub's own network.

on:
  push:
    tags:
      - 'beta*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The ubuntu runner ships a preinstalled Android SDK (ANDROID_HOME);
      # only license acceptance is needed — AGP auto-installs any missing
      # platform/build-tools components.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK (project debug keystore, same as every LinkHelm build)
        run: |
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks ci/debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out "LinkHelm-Host-Android-${GITHUB_REF_NAME}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify \
            "LinkHelm-Host-Android-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: LinkHelm-Host-Android-*.apk
          if-no-files-found: error

  windows:
    name: Build Windows EXE (native C++)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1.1.0: the desktop app is the native C++ edition (cpp/). The legacy
      # Python edition stays in the tree under laptop_proxy/ but is no longer
      # the shipped binary.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Build EXE
        shell: msys2 {0}
        run: |
          cmake -S cpp -B cpp/build -G "MinGW Makefiles" \
                -DCMAKE_CXX_COMPILER=g++ \
                -DCMAKE_MAKE_PROGRAM=mingw32-make
          cmake --build cpp/build --parallel

      - name: Package win64 zip
        shell: pwsh
        run: |
          $pkg = "LinkHelm_Desktop"
          New-Item -ItemType Directory -Force "$pkg/engine", "$pkg/mihomo" | Out-Null
          Copy-Item cpp/build/LinkHelmDesktop.exe $pkg/
          Copy-Item cpp/dist/lang.txt $pkg/
          Copy-Item laptop_proxy/engine/hev-socks5-tunnel.exe,`
                    laptop_proxy/engine/linkhelm_ics.exe,`
                    laptop_proxy/engine/linkhelm_netops.exe,`
                    laptop_proxy/engine/linkhelm_supervisor.exe,`
                    laptop_proxy/engine/msys-2.0.dll,`
                    laptop_proxy/engine/wintun.dll "$pkg/engine/"
          Copy-Item laptop_proxy/mihomo/mihomo.exe,`
                    laptop_proxy/mihomo/verge-mihomo.exe "$pkg/mihomo/"
          Compress-Archive -Path "$pkg/*" -DestinationPath "LinkHelm.Desktop-${{ github.ref_name }}-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-zip
          path: LinkHelm.Desktop-*-win64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-apk

      - uses: actions/download-artifact@v4
        with:
          name: desktop-zip

      # Publish a checksum manifest alongside the binaries.
      - name: Generate SHA256SUMS.txt
        run: sha256sum LinkHelm-Host-Android-*.apk LinkHelm.Desktop-*.zip > SHA256SUMS.txt

      # 1.1.0: publish as a DRAFT release — the maintainer reviews and
      # publishes it manually from the GitHub UI after checking the artifacts.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          FILES=("LinkHelm-Host-Android-${TAG}.apk" "LinkHelm.Desktop-${TAG}-win64.zip" "SHA256SUMS.txt")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "LinkHelm ${TAG}" \
              --notes-file RELEASE_NOTES.md \
              --draft \
              --repo "$GITHUB_REPOSITORY"
          fi
